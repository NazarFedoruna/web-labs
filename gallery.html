<html lang="uk">
<head>

            text-align: center;
            font-size: 1.5em; 
        }

        .heading-smaller {

            font-size: calc(1.5em * 0.7); 
        }

        }

        .heading-larger2 {
            text-align: center;

            margin: 0 auto 20px auto;
        }

</head>
<body>

    <h3 class="heading-larger1">Зображення у папці</h3>
    <img src="images/placeholder640.png" alt="Зображення у папці images">
